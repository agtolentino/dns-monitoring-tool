name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest flake8

      # Fails the build only on real errors (syntax errors, undefined names)
      - name: Lint (errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Style issues are reported but don't fail the build
      - name: Lint (style, warnings only)
        run: flake8 . --count --exit-zero --max-line-length=100 --statistics

      # "python -m pytest" puts the project folder on the path so tests can import checks.py
      - name: Run tests
        run: python -m pytest -v
